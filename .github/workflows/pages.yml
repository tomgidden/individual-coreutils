name: Deploy docs to GitHub Pages

# Rebuilds and republishes the docs site on every push to main, and
# whenever a new release is published (so per-utility pages pick up
# the latest release's man pages/links promptly rather than waiting
# for the next unrelated commit to main).

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate per-utility doc pages from latest release
        run: scripts/generate-docs-pages.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install docmd
        run: npm install -g @docmd/core@0.9.2

      - name: Build site
        run: docmd build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
