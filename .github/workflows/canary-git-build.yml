name: Canary (git bootstrap build)

# Secondary path: builds straight from a git checkout + ./bootstrap,
# using the full GNU autotools chain. Not used for releases -- this
# exists to catch upstream coreutils build-system breakage independent
# of the release-tarball infrastructure, and to prove the git path
# still works without needing it day to day.

on:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install autotools chain
        run: brew install autoconf automake autopoint pkg-config help2man texinfo gperf

      - name: Build utils.txt
        run: scripts/build-git.sh

      - name: Package (not published, just verifying it completes)
        run: scripts/package.sh arm64-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: canary-dist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
